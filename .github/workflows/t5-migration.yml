---
# T5 — migration. Does `update.php` upgrade an EXISTING wiki?
#
# T3 (the sibling workflow) proves a fresh install works. Every real HDP
# operator instead runs new code against a database that already holds pages,
# users and permissions — and none of the code that migrates rows is reached by
# an install into an empty schema. Until this job existed, the upgrade path had
# never been executed anywhere in CI.
#
# scripts/ci/t5-migration.sh installs normally (for app/vendor/ and
# LocalSettings.php, neither of which is committed), then drops the database,
# loads docker/ci/fixtures/seeded-wiki.sql.gz — a real wiki captured before the
# upgrade — and runs update.php against that.
#
# Same runner and same profile as T3, four containers, and roughly the same
# wall clock: the expensive services (haystack, chatbot-proxy) are not involved
# in a schema migration.
#
# It runs on every push to main and on pull requests rather than nightly,
# because the things that break it — a schema change, a new extension, a
# settings.d edit — arrive in ordinary commits, not on a schedule.

name: T5 migration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: t5-${{ github.ref }}
  cancel-in-progress: true

# Installs, loads a database fixture and runs update.php — all inside the
# runner. Nothing is written back to the repository.
permissions:
  contents: read

jobs:
  t5:
    name: update.php upgrades an existing wiki
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Same reclaim as t4-smoke.yml. T5 is the tightest of the three tiers for
      # space after T4: it builds the 2.47 GB opensearch image and loads a DB
      # fixture on top, on a stock ubuntu-latest. The failure it buys headroom
      # against is the quiet one — OpenSearch past the flood-stage watermark
      # turns the index read-only, setup.sh still reports success, and the
      # migration assertions fail much later pointing at the wrong thing. The
      # script's own HDP_T5_MIN_DISK_GB precondition fails fast if this step
      # ever stops being enough.
      #
      # /opt/hostedtoolcache is left alone on purpose: the pytest step below
      # resolves python3 and pip through it.
      - name: Reclaim runner disk
        run: |
          echo "before:"
          df -h / /var/lib/docker 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"
          df -h / /var/lib/docker 2>/dev/null || df -h /

      # Standard library only, like T3: the whole dependency list is docker,
      # python3 and pytest.
      - name: Install pytest
        run: python3 -m pip install --quiet --no-cache-dir pytest==9.0.2

      - name: Run T5
        run: bash scripts/ci/t5-migration.sh

      - name: Container logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail 300 mediawiki mediawiki-web || true
