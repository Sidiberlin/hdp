---
# T3 — integration. Boots the wiki, installs it, and asserts it serves real
# authenticated traffic.
#
# On GitHub rather than GitLab because this is the one job that needs a
# generous runner: `ubuntu-latest` gives 16 GB of RAM and a working docker
# daemon out of the box. Everything else in this project's pipeline lives in
# .gitlab-ci.yml and is forge-agnostic on purpose; this file is the deliberate
# exception, and it is a thin caller of scripts/ci/t3-integration.sh so the
# logic stays reproducible on any machine with docker.
#
# Wave 1.7 (the GitLab↔GitHub mirror) is still open, so this may not fire
# automatically yet. It is written to be ready: `workflow_dispatch` means it
# can be run by hand today, and no step depends on the mirror existing.
#
# Cost note: T3 skips the haystack and chatbot-proxy services, which is where
# nearly all of the build time lives — haystack alone is a 2.5 GB image and
# ~285 of the ~290 seconds a full build takes. Peak memory for all seven
# containers was measured at 2.65 GiB in Wave 0, so this profile is far inside
# a 16 GB runner; the saving is wall clock, not RAM.

name: T3 integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push should not race a running install against the same docker
# daemon; cancel the older one instead.
concurrency:
  group: t3-${{ github.ref }}
  cancel-in-progress: true

# Boots containers from a checkout and asserts against them; nothing is written
# back to the repository. Least privilege for the same reason as ci.yml — the
# repository default would otherwise apply.
permissions:
  contents: read

jobs:
  t3:
    name: wiki boots and serves authenticated traffic
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Same reclaim as t4-smoke.yml, and for the same reason: this job boots
      # the same OpenSearch, and past the flood-stage watermark the index goes
      # read-only, setup.sh still reports success, and the job fails much later
      # with assertions that point somewhere else. T3 pulls less than T4, so it
      # has more headroom — but "more headroom" is not a guard, and the script's
      # own HDP_T3_MIN_DISK_GB precondition is what fails fast if this step ever
      # stops being enough.
      #
      # /opt/hostedtoolcache is left alone on purpose: the pytest step below
      # resolves python3 and pip through it.
      - name: Reclaim runner disk
        run: |
          echo "before:"
          df -h / /var/lib/docker 2>/dev/null || df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          echo "after:"
          df -h / /var/lib/docker 2>/dev/null || df -h /

      # The integration tier is standard library only — no requests, no
      # haystack, nothing to install beyond pytest itself. That is the whole
      # reason this job's dependencies are just docker and python3.
      - name: Install pytest
        run: python3 -m pip install --quiet --no-cache-dir pytest==9.0.2

      # docker-registry.wikimedia.org stopped answering anonymous pulls from
      # GitHub runner IPs on 2026-09-23 — this job was green at 15:10 CET and
      # every boot after it failed with the same HTML `denied`, while the same
      # tags stayed pullable from everywhere else. This points the three wiki
      # images at the GHCR mirror for the length of the job; docker-compose.yml
      # keeps the upstream refs as its defaults, so nothing outside CI moves.
      # The step fails loudly if the mirror has not got the pinned tag, which
      # is the signal to re-run scripts/ci/mirror-images.sh --push.
      - name: Point the wiki images at the CI mirror
        run: bash scripts/ci/mirror-images.sh --github-env

      # Everything else lives in the script, so this job and a developer's
      # terminal run identical code. The script creates a throwaway .env with
      # generated passwords and removes it again, brings up the minimal
      # profile, runs setup.sh, runs tests/integration, and tears down with -v.
      - name: Run T3
        run: bash scripts/ci/t3-integration.sh

      # Only on failure, and only the wiki containers: enough to see a PHP
      # fatal or a failed install without dumping a passing job's logs.
      - name: Container logs
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs --no-color --tail 300 mediawiki mediawiki-web || true
