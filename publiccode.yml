publiccodeYmlVersion: '0.2'
name: BlueSpice Wiki mit Chatbot
applicationSuite: BlueSpice pro
url: 'https://github.com/Sidiberlin/hdp'
landingURL: 'https://github.com/Sidiberlin/hdp#readme'
logo: BlueSpice_Logo.svg
releaseDate: '2026-08-03'
# Kept in step with VERSIONS.yml by the version-consistency gate. This said
# 5.1.3 while every bluespice/* package in app/composer.lock was 5.1.4, so the
# openCode catalogue was being told the wrong version.
softwareVersion: 5.1.9
developmentStatus: stable
platforms:
  - linux
softwareType: addon
# `usedBy` is deliberately empty. Upstream listed the Bundesministerium für
# Bildung und Forschung, GovTech Campus Deutschland e.V. and Fraunhofer IVV —
# their institutional users, not this fork's. Inheriting that list would assert
# that a federal ministry runs this repository, which it does not. Their role
# in the original project is credited in README.md and in `longDescription`
# below, which is where it belongs.
usedBy: []
categories:
  - blog
  - collaboration
  - content-management
  - document-management
  - knowledge-management
  - translation
  - workflow-management
# Upstream's contacts (Robert Vogel, Richard Heigl, both at BlueSpice) were
# removed: they maintain the original, not this fork, and naming them here
# routes this fork's issues to people who never agreed to receive them.
maintenance:
  type: community
  contacts:
    - name: Sidiberlin
legal:
  license: GPL-3.0-only
  # Unchanged, and correct: Hallo Welt! GmbH holds copyright in the bulk of
  # this tree. Only the *repository* owner differs on a fork.
  mainCopyrightOwner: Hallo Welt! GmbH
  repoOwner: Sidiberlin
intendedAudience:
  countries:
    - DE
    - US
    - FR
    - IT
localisation:
  localisationReady: true
  availableLanguages:
    - de
    - en
    - fr
    - it
description:
  de:
    genericName: BlueSpice Wiki mit Chatbot
    localisedName: BlueSpice Wiki mit Chatbot
    screenshots: []
    shortDescription: >-
      Die BlueSpice HDP Edition liefert einen KI-Chatbot für Online
      Wissensdatenbanken.
    # Required by the publiccode.yml schema and shown as the feature list in
    # the openCode catalogue. Taken verbatim from the "Funktionen" section of
    # longDescription below rather than newly written, so the catalogue entry
    # and the description cannot drift apart.
    features:
      - Chatoberfläche mit Anbindung an LLM und Wikisoftware
      - >-
        Generierung von Antworten, Zusammenfassungen, Checklisten oder
        E-Mailtexten
      - >-
        Ausgabe mit Kurzreferenz, Quelle, Verzeichnis und weiterführenden
        Informationen
      - Export von Chatverläufen
      - Kopieren und Bewerten von Antworten
      - Beschleunigte Auswahl von Nachfragen
    longDescription: >
      # **Künstliche Intelligenz revolutioniert die Arbeit mit Wikis!**

      ## Die BlueSpice HDP Edition entspringt einem Projekt zur Entwicklung eines KI-Chatbots für Online-Wissensdatenbanken.

      Entwickelt in Zusammenarbeit zwischen Bundesministerium
      für Bildung und Forschung, deepset GmbH, GovTech Campus
      Deutschland e.V., Hallo Welt! GmbH und dem Fraunhofer IVV.

      ### Anwendung:

      Durch die Einbindung eines Large Language Models über Haystack (D-Stack Standard für KI) wird der Zugriff auf Inhalte eines Wikis personenunabhängiger, benutzerfreundlicher und inklusiver:

      - Alle Antworten beruhen auf definierten Inhalten einer redaktionell pflegbaren, immer aktuellen Wissensdatenbank

      - Die Kommunikation erfolgt in natürlicher Sprache

      - Fragen zu einem Themengebiet werden in Echtzeit beantwortet

      ### Funktionen:

      - Chatoberfläche mit Anbindung an LLM und Wikisoftware

      - Generierung von Antworten, Zusammenfassungen, Checklisten oder E-Mailtexten

      - Ausgabe mit Kurzreferenz, Quelle, Verzeichnis und weiterführenden Informationen

      - Export von Chatverläufen

      - Kopieren und Bewerten von Antworten

      - Beschleunigte Auswahl von Nachfragen

      - Mehr Informationen: www.bluespice.de - haystack.deepset.ai
