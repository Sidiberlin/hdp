# GitLab CI for HDP.
#
# Deliberately forge-agnostic: no host-specific job names, runner tags or
# variables, so enabling this on another GitLab (openCode) is configuration
# rather than rework.
#
# All logic lives in scripts/ci/ and scripts/. The jobs below are thin callers,
# which is what lets scripts/check.sh give a contributor the same verdict
# locally without reimplementing anything.

stages:
  - lint
  - test
  - fresh
  - patch
  - integration

variables:
  # Full-enough history for the fresh-clone gate to clone HEAD locally.
  GIT_DEPTH: "20"

# Every job carries the same rules guard. Hoisted into an anchor so the next
# job added cannot quietly omit it — which is how a pipeline starts running on
# every branch push and then gets switched off for being noisy.
.default_rules: &default_rules
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ─── Shell script linting ───────────────────────────────────────────
shellcheck:
  stage: lint
  image: koalaman/shellcheck-alpine:stable
  <<: *default_rules
  script:
    # Explicit include list, not an exclude list. The previous exclude form
    # linted upstream MediaWiki and BlueSpice shell under app/vendor/,
    # app/includes/ and app/_bluespice/ — code this project does not own.
    # Passing install.sh and hdp.sh to find as start paths keeps this to one
    # invocation, so the exit status cannot be masked by a later command.
    # Kept identical to scripts/check.sh's shellcheck step — the point of that
    # script is that its verdict is this job's verdict.
    - |
      find docker scripts install.sh update.sh hdp.sh -name '*.sh' -print0 \
        | xargs -0 -r shellcheck --severity=warning --

# ─── YAML validation ────────────────────────────────────────────────
yaml-lint:
  stage: lint
  image: cytopia/yamllint:latest
  <<: *default_rules
  script:
    # This job used to end in `2>/dev/null || true`, so it could never fail and
    # never showed why. Both are gone. Dropping only the `|| true` would have
    # produced a red job with no diagnostics, which is worse than either.
    - |
      yamllint -d "{extends: default, rules: {line-length: disable, document-start: disable, truthy: disable}}" \
        docker-compose.yml \
        publiccode.yml \
        VERSIONS.yml \
        docker/haystack/hdp_pipeline.yaml \
        docker/patches/ \
        .gitlab-ci.yml \
        .github/workflows/

# ─── Python linting ─────────────────────────────────────────────────
ruff:
  stage: lint
  image: ghcr.io/astral-sh/ruff:0.16.1
  <<: *default_rules
  script:
    # tests/ is in scope as of Wave 2. Without it the whole suite would be
    # invisible to the linter, which is how test code rots.
    - ruff check docker/ scripts/ tests/

# ─── Unit tests ─────────────────────────────────────────────────────
# Two tiers, split by what the code under test actually imports.
#
# render_pipeline.render, build_result_from_haystack and the wikitext pure
# functions import nothing outside the standard library, so pytest-unit needs
# no install at all and finishes in about two seconds. Only to_native() and
# load_pipeline() need Haystack, and that tier is affordable because of a
# measurement rather than an assumption:
#
#     pip install haystack-ai==2.15.0  ->  24s, 172MB, no torch, no transformers
#
# torch and transformers arrive via sentence-transformers, a runtime dependency
# of the embedder that nothing under test touches. So nothing is mocked
# anywhere in this suite — the tests use real Document, GeneratedAnswer,
# ExtractedAnswer and Answer objects.
pytest-unit:
  stage: test
  image: python:3.11-slim
  <<: *default_rules
  script:
    - pip install --quiet --no-cache-dir --root-user-action=ignore pytest==9.0.2
    - python -m pytest tests/unit

pytest-haystack:
  stage: test
  image: python:3.11-slim
  <<: *default_rules
  variables:
    DEBIAN_FRONTEND: "noninteractive"
  before_script:
    # load_pipeline() shells out to envsubst, exactly as it does in the
    # haystack image. Providing it beats mocking the call.
    - apt-get update -qq > /dev/null
    - apt-get install -y -qq --no-install-recommends gettext-base > /dev/null
  script:
    - pip install --quiet --no-cache-dir --root-user-action=ignore -r tests/requirements.txt
    - python -m pytest tests/haystack

# ─── Shell behaviour ────────────────────────────────────────────────
# Three suites: docker/infisical-loader.sh, verify-patches.sh's upgrade report,
# and the T4 free-space arithmetic in scripts/ci/lib/stack.sh.
# docker/setup.sh remains out of scope — it is a 557-line top-to-bottom
# installer under `set -euo pipefail`, so asserting its exit code needs MariaDB
# and composer, which is Wave 3's integration job, not this one.
#
# Pinned by digest rather than :latest. A moving tag means this job's verdict
# can change with no commit to blame — see the note on the anchors above and
# the reasoning recorded in ruff.toml.
bats:
  stage: test
  # The image's entrypoint is bats itself; overriding it to "" is what lets a
  # before_script run at all. curl is then shadowed by the test double in
  # tests/bats/helpers/bin; jq and the loader under test are real.
  image:
    name: bats/bats@sha256:5322b877351fda0cc435de8c6116de7d0a2ec79d7c680132a0ef329a633bc66f
    entrypoint: [""]
  <<: *default_rules
  before_script:
    # jq/curl for the loader suite; python3 and patch for the upgrade-report
    # suite, which drives verify-patches.sh and would otherwise fail on the
    # missing tool rather than on the behaviour under test; git for
    # update_pipe.bats's port-migration fixture (init/commit/tag/clone/push
    # against a real bare remote). Kept in step with scripts/ci/bats.sh.
    - apk add --no-cache jq curl python3 patch git > /dev/null
  script:
    - bats tests/bats

# ─── settings.d syntax ──────────────────────────────────────────────
php-lint:
  stage: lint
  image: php:8.3-cli
  <<: *default_rules
  script:
    # 17 files gating ~130 extensions; a syntax error here takes the wiki down
    # at boot, and nothing else in the pipeline parses them.
    - |
      rc=0
      for f in app/settings.d/*.php; do
        php -l "$f" > /dev/null || { php -l "$f"; rc=1; }
      done
      exit $rc

# ─── Docker Compose config validation ───────────────────────────────
compose-validate:
  stage: lint
  image: docker:24-cli
  <<: *default_rules
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    # v2, via `docker compose`. This job used to `apk add docker-compose`,
    # which installs v1 — a different schema from the `docker compose` users
    # actually run per CONTRIBUTING.md, and a reliable way to be green in CI
    # and broken locally.
    - cp .env.example .env
    - docker compose config --quiet

# ─── T0 provenance ──────────────────────────────────────────────────
gitleaks:
  stage: lint
  # Digest, not `:latest`, and the same one scripts/ci/gitleaks.sh pins — the
  # thing that decides whether this repository publishes a secret must not
  # change under two runs of the same commit. gitleaks v8.30.1.
  image: zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  <<: *default_rules
  before_script:
    # git refuses to operate on a tree it considers foreign-owned. Harmless
    # when the runner's UID already matches; prevents an opaque
    # "dubious ownership" failure when it does not.
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    # The script prefers a gitleaks binary on PATH, which this image provides.
    - apk add --no-cache bash git >/dev/null
    - bash scripts/ci/gitleaks.sh

env-example-check:
  stage: lint
  image: alpine:3.20
  <<: *default_rules
  script:
    - apk add --no-cache bash git grep >/dev/null
    - bash scripts/ci/env-example-check.sh

publiccode-schema:
  stage: lint
  image: italia/publiccode-parser-go:latest
  <<: *default_rules
  # The image's entrypoint is the parser itself, so call it directly rather
  # than through the wrapper script.
  script:
    - publiccode-parser -no-network publiccode.yml

patch-ignore-check:
  stage: lint
  image: alpine:3.20
  <<: *default_rules
  before_script:
    # git refuses to operate on a tree it considers foreign-owned. Harmless
    # when the runner's UID already matches; prevents an opaque
    # "dubious ownership" failure when it does not.
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    - apk add --no-cache bash git >/dev/null
    - bash scripts/ci/patch-ignore-check.sh

manifest-lint:
  stage: lint
  image: python:3.11-alpine
  <<: *default_rules
  before_script:
    # git refuses to operate on a tree it considers foreign-owned. Harmless
    # when the runner's UID already matches; prevents an opaque
    # "dubious ownership" failure when it does not.
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    # Schema and target paths only — catches a malformed sidecar in seconds
    # rather than at the end of the patch stage.
    - apk add --no-cache bash git >/dev/null
    - pip install --quiet pyyaml
    - bash scripts/verify-patches.sh --static

version-consistency:
  stage: lint
  image: python:3.11-alpine
  <<: *default_rules
  script:
    # The cheapest job in the pipeline, and the prerequisite for every other
    # part of the upstream-security process: monitoring for "has upstream moved
    # past us" is meaningless until "where are we" has one answer. It reads
    # VERSIONS.yml with a stdlib fallback, so no pip install is needed.
    - apk add --no-cache bash git >/dev/null
    - bash scripts/ci/version-consistency.sh

composer-audit:
  stage: lint
  image: composer:2.8
  <<: *default_rules
  # The only job in this file that needs the network for its verdict: it reads
  # app/composer.lock against the packagist advisory database. `allow_failure`
  # stays false — a new CVE should stop a merge — but the script itself exits
  # 77 when the database does not answer, so an outage is a loud skip rather
  # than a false green.
  script:
    - apk add --no-cache bash git python3 >/dev/null
    - bash scripts/ci/composer-audit.sh

# ─── TF — fresh-clone gate ──────────────────────────────────────────
fresh-clone:
  stage: fresh
  image: alpine:3.20
  <<: *default_rules
  before_script:
    # git refuses to operate on a tree it considers foreign-owned. Harmless
    # when the runner's UID already matches; prevents an opaque
    # "dubious ownership" failure when it does not.
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    # Clones the repo under test at HEAD into a temp dir and asserts every
    # input setup.sh needs is committed. Six of the seven bugs in
    # docs/QA-REPORT.md were only visible on a genuine fresh clone.
    - apk add --no-cache bash git python3 findutils grep >/dev/null
    - bash scripts/ci/fresh-clone.sh

# ─── T2 — patch integrity ───────────────────────────────────────────
# Not enabled yet: it needs composer install + dump-autoload against the
# production wikimedia image and a masked GITHUB_TOKEN, which is the T2 task.
# manifest-lint above covers the manifest itself in the meantime, and
# verify-patches.sh is ready for this job to call.

# ─── T3 — integration ───────────────────────────────────────────────
# Boots the wiki, installs it, and asserts it serves real authenticated
# traffic. All the logic is in scripts/ci/t3-integration.sh, so this job and a
# developer's terminal run the same code.
#
# `manual` on purpose, for one honest reason: this is the only job in the file
# that needs docker-in-docker and a runner with real memory, and this project
# does not yet know what its GitLab runners look like (Wave 1.7 — the
# repo/mirror/PAT decisions — is still open). A job that assumes a privileged
# dind runner and finds a shared one fails on every pipeline with an error
# about the docker socket, and a permanently red pipeline teaches everyone to
# ignore it. So: available to run by hand from day one, and one word away from
# automatic once the runner is known.
#
# The canonical automatic run is .github/workflows/t3-integration.yml, where
# `ubuntu-latest` provides 16 GB and a working daemon with no configuration.
t3-integration:
  stage: integration
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *default_rules
  when: manual
  allow_failure: false
  timeout: 45m
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    # The integration tier is standard library only, so this is the entire
    # dependency list: bash, git, python3 and pytest. No haystack, no requests.
    - apk add --no-cache bash git curl python3 py3-pip >/dev/null
    - pip install --quiet --break-system-packages pytest==9.0.2
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    - bash scripts/ci/t3-integration.sh
  after_script:
    - docker compose ps || true

# ─── T5 — the migration job ─────────────────────────────────────────
# Boots the stack, installs it, then loads the seeded snapshot over the
# database and runs update.php against it. `manual` for the same reason as T3
# and T4: this file cannot yet assume what a GitLab runner here looks like.
#
# The canonical automatic run is .github/workflows/t5-migration.yml.
t5-migration:
  stage: integration
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *default_rules
  when: manual
  allow_failure: false
  timeout: 45m
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    - apk add --no-cache bash git curl python3 py3-pip >/dev/null
    - pip install --quiet --break-system-packages pytest==9.0.2
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    - bash scripts/ci/t5-migration.sh
  after_script:
    - docker compose ps || true

# ─── T4: the full-stack smoke suite ─────────────────────────────────
# All seven containers, the search leg and the chatbot leg. Same shape as the
# job above and for the same reasons — all the logic is in
# scripts/ci/t4-smoke.sh, and `manual` because this file still cannot assume
# what a GitLab runner here looks like.
#
# No `--cache`: that flag configures a *GitHub Actions* cache backend, which
# does not exist here. GitLab's equivalent would be a registry-backed buildx
# cache, and picking one is a decision for whoever provisions these runners.
#
# The canonical automatic run is .github/workflows/t4-smoke.yml — nightly plus
# tags, where the layer cache and the model cache both have a backend.
t4-smoke:
  stage: integration
  image: docker:24-cli
  services:
    - docker:24-dind
  <<: *default_rules
  when: manual
  allow_failure: false
  timeout: 90m
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: "tcp://docker:2375"
  before_script:
    # Same dependency list as T3: the tier is standard library only. What T4
    # adds is containers and waiting, not python packages.
    - apk add --no-cache bash git curl python3 py3-pip >/dev/null
    - pip install --quiet --break-system-packages pytest==9.0.2
    - git config --global --add safe.directory "${CI_PROJECT_DIR:-$PWD}"
  script:
    - bash scripts/ci/t4-smoke.sh
  after_script:
    - docker compose ps --all || true
