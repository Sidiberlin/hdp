; pytest configuration for HDP.
;
; The code under test is not a package. It is four loose scripts that live
; inside Docker build contexts and are executed as `python3 <file>` in their
; containers. `pythonpath` below is what makes them importable from tests
; without turning them into a package, adding __init__.py files, or having the
; tests mutate sys.path themselves.
;
; Three tiers, and the split is not cosmetic:
;
;   tests/unit/      imports nothing outside the standard library. Runs on a
;                    bare python:3.11 in about two seconds. This is the tier a
;                    contributor runs on every save.
;   tests/haystack/  needs `pip install -r tests/requirements.txt` (haystack-ai)
;                    and `envsubst` on PATH. About 30s cold, 2s warm.
;   tests/integration/  Wave 3. Needs a running, installed wiki and a docker
;                    socket. Standard library only — what it needs is the stack.
;
; `testpaths` lists only the first two. That is deliberate: a bare `pytest` at
; the repo root should run everything that works on a plain checkout, and
; tests/integration does not — pointed at a wiki that is not there it fails
; hard by design, because a skip would be a green run against a stack that
; never booted. Ask for it by path or by tier:
;
;   scripts/ci/pytest.sh --tier integration
;   scripts/ci/t3-integration.sh          (boots the stack first)
;
; Run everything through scripts/ci/pytest.sh rather than invoking pytest
; directly — it knows how to satisfy each tier's dependencies.

[pytest]
testpaths = tests/unit tests/haystack
pythonpath =
    docker/haystack
    docker/chatbot-proxy
    scripts/lib
    ; tests/integration holds wikiclient.py, whose response parsing is pure and
    ; is unit-tested from tests/unit. pytest only puts a test file's own
    ; directory on sys.path, so without this the fast tier could not import it —
    ; and the consent-shape regression it guards would stay findable only by
    ; booting a wiki.
    tests/integration

; --strict-markers turns a typo'd marker into an error instead of a silently
; unfiltered test run.
addopts = -q --strict-markers

markers =
    haystack: requires haystack-ai and envsubst (the tests/haystack tier)
    ; Wave 4 / T4. Marks the tests in tests/integration that need the *full*
    ; seven-container stack — the search leg (mediawiki-jobrunner) and the
    ; chatbot leg (haystack, chatbot-proxy). `--tier integration` deselects
    ; them with `-m "not smoke"`, because T3's profile deliberately omits
    ; those three services; `--tier smoke` runs the directory unfiltered, so
    ; T4 is a superset of T3 rather than a second suite to keep in step.
    ;
    ; The marker, rather than a fourth directory, is what keeps one conftest
    ; and one wiki client serving both tiers.
    smoke: needs the full seven-container stack (the tests/integration smoke tier)
