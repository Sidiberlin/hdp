; pytest configuration for HDP.
;
; The code under test is not a package. It is four loose scripts that live
; inside Docker build contexts and are executed as `python3 <file>` in their
; containers. `pythonpath` below is what makes them importable from tests
; without turning them into a package, adding __init__.py files, or having the
; tests mutate sys.path themselves.
;
; Two tiers, and the split is not cosmetic:
;
;   tests/unit/      imports nothing outside the standard library. Runs on a
;                    bare python:3.11 in about two seconds. This is the tier a
;                    contributor runs on every save.
;   tests/haystack/  needs `pip install -r tests/requirements.txt` (haystack-ai)
;                    and `envsubst` on PATH. About 30s cold, 2s warm.
;
; Run them through scripts/ci/pytest.sh rather than invoking pytest directly —
; it knows how to satisfy the second tier's dependencies.

[pytest]
testpaths = tests
pythonpath =
    docker/haystack
    docker/chatbot-proxy

; --strict-markers turns a typo'd marker into an error instead of a silently
; unfiltered test run.
addopts = -q --strict-markers

markers =
    haystack: requires haystack-ai and envsubst (the tests/haystack tier)
