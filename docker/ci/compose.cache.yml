---
# CI-only compose overlay: Docker layer caching and the HuggingFace model cache.
#
#   docker compose -f docker-compose.yml -f docker/ci/compose.cache.yml build
#   scripts/ci/t4-smoke.sh --cache          (does the above)
#
# Kept out of docker-compose.yml deliberately. Everything in here is about the
# machine running the build, not about the product: a developer's `docker
# compose up` must not depend on a GitHub Actions cache backend existing, and
# an operator deploying this stack must not inherit a bind mount pointed at a
# directory in the repo.
#
# ─── 4.5 buildx GHA layer cache ─────────────────────────────────────
#
# Three of the seven services are built rather than pulled, and haystack is
# ~285 of the ~290 seconds a cold build takes (a 2.5 GB image: torch,
# transformers, sentence-transformers). Caching its layers turns the nightly
# T4's build step from ~5 minutes into well under one on a warm cache.
#
# ─── `cache_from`/`cache_to`, and the `x-bake` this used to say ─────
#
# This block was written as `build.x-bake.cache-from`, on the belief that
# compose's own `build.cache_from` goes to the classic builder and cannot
# express `type=gha`. That is wrong, and it cost run 30873842113 a red
# cache-proof job: `docker compose build` reads no `x-bake` key at all.
#
# `x-bake` is a *bake* extension. It is honoured when buildx consumes a compose
# file directly — `docker buildx bake -f docker-compose.yml` — because bake
# parses the file itself. `docker compose build` with COMPOSE_BAKE=1 does not
# hand bake this file; it builds its own bake definition from the compose model
# and shells out with that. Unknown `x-*` keys are not part of the model, so
# they are dropped in the translation, silently and by design.
#
# What that translation *does* carry is the standard fields: compose's
# build_bake.go sets the bake target's `cache-from`/`cache-to` straight from
# `build.cache_from`/`build.cache_to`, verbatim, `type=gha` and all. So the
# plain spelling is not the weaker one here — it is the only one that works.
#
# How it looked when it was broken, in both jobs of run 30873842113: the build
# printed `#1 [internal] load local bake definitions`, so bake was in use and
# COMPOSE_BAKE was doing its job, and then no `importing cache manifest` step
# and no cache export step — nothing was read and, more tellingly, nothing was
# ever written either. A cache that is misconfigured on the import side still
# exports; one that is dropped before bake sees it does neither.
#
# COMPOSE_BAKE=1 is still required — scripts/ci/t4-smoke.sh sets it whenever
# --cache is passed. `docker compose build --print` renders the bake definition
# these fields produce, which is what .github/workflows/t4-smoke.yml now
# asserts against, so this can never again be ambiguous in a log.
#
# `mode=max` exports intermediate layers too, not just the final image. For a
# multi-stage-ish pip install that is the difference between caching the whole
# dependency install and caching nothing useful.
#
# ─── What this cache cannot do, and why that is correct ─────────────
#
# Every step's cache key is chained off the resolved digest of the base image,
# so when `python:3.12-slim`, `python:3.11-slim-bookworm` or
# `opensearchproject/opensearch:2.18.0` is republished, the whole chain under it
# is invalidated and the next build is cold no matter what is in the cache. That
# is not a misconfiguration to be worked around — it is the cache noticing that
# the image would otherwise be built on a base nobody asked for.
#
# It does mean the warm-cache figure above is a best case, not a nightly
# guarantee. Docker Hub moved `python:3.12-slim` three times in the 28 hours
# around 2026-08-05, and each of those costs one nightly its chatbot-proxy
# cache; `python:3.11-slim-bookworm` moves more slowly, which is fortunate,
# because haystack is the one that matters. Pinning the bases by digest would
# make every night warm, at the price of taking Debian's security rebuilds only
# when somebody remembers to bump a sha256. That trade is not worth making for a
# build-time saving, and the T4 workflow's cache-proof job no longer depends on
# the tags holding still either.
#
# Per-service `scope`: the GHA backend keys its cache by scope, and without
# distinct ones the three builds overwrite each other's entry on every run and
# the cache never hits. This is the single easiest way to configure a cache
# that appears to work and never does.
#
# ─── 4.6 HuggingFace model cache ────────────────────────────────────
#
# The haystack entrypoint pre-downloads two sentence-transformers models
# (~1.7 GB) on first run. In production that lands in the `haystack_models`
# named volume and survives restarts; in CI every job starts with no volumes at
# all, so it is re-downloaded every night.
#
# The override points the same container path at a directory inside the
# workspace, which `actions/cache` can then save and restore. Compose merges a
# service's `volumes` by container path, so this *replaces* the named-volume
# mount rather than adding a second one — verified with `docker compose config`
# in the T4 validation, because a silent append would mount both and the one
# that wins would be undefined.
#
# The directory is written by a root container, so the workflow chowns it back
# before the cache action tars it up.
services:
  opensearch:
    build:
      cache_from:
        - type=gha,scope=hdp-opensearch
      cache_to:
        - type=gha,scope=hdp-opensearch,mode=max

  haystack:
    build:
      cache_from:
        - type=gha,scope=hdp-haystack
      cache_to:
        - type=gha,scope=hdp-haystack,mode=max
    volumes:
      - ./.hf-cache:/root/.cache/huggingface

  chatbot-proxy:
    build:
      cache_from:
        - type=gha,scope=hdp-chatbot-proxy
      cache_to:
        - type=gha,scope=hdp-chatbot-proxy,mode=max
