# Class A — clobbered by composer, re-applied by scripts/apply-patches.sh.
#
# `composer install` reinstalls mediawiki/maps as a dist zipball, which
# overwrites app/extensions/Maps wholesale on every run. Paired with
# maps-layercontrol-xss-js: the JS half stops a hostile label from executing,
# this half stops it reaching the client at all. One manifest entry is one
# target file, which is why a single upstream commit is two patches here.
id: maps-layercontrol-xss-php
title: enforce the Leaflet available-layers whitelist (CVE-2026-52854)
class: A
mode: insert
target: extensions/Maps/src/LeafletService.php
applied_by: scripts/apply-patches.sh (called by docker/setup.sh)
patch: docker/patches/maps-layercontrol-xss-php.patch
# ERE. The line the hunk is anchored after. `.` stands in for the single
# quotes around imageLayers so this stays a single-quoted YAML scalar.
anchor: '\$params\[.imageLayers.\] = \$this->getJsImageLayers'
# The doc comment on the inserted method, not the method signature: a
# re-derive that dropped the two call sites but kept the helper would still
# match a signature, and the helper alone changes nothing.
marker: 'HDP: backport of upstream Maps 12\.1\.3 \(CVE-2026-52854\)'
anti: ''
group: maps-layercontrol-xss
stale: false
upstream_version: 'mediawiki/maps 11.0.1'
regex: ERE
hunks: 1
why: >-
  CVE-2026-52854, stored XSS. The layers and overlays parameters of
  display_map declare a `values` whitelist, but ParamProcessor only emits a
  non-fatal warning for values outside it and passes them through, so any
  editor can put an arbitrary string into a Leaflet layer-control label.
  Backported verbatim from upstream Maps 12.1.3 commit 737a993f; this tree
  vendors 11.0.1 and the BlueSpice pro distribution constrains mediawiki/maps
  to 11.0.*, so the fix cannot be taken by re-vendoring inside the 5.1 series.
  Retire this patch, its pair and both sidecars when Maps reaches 12.1.3 or
  later.
