[www]
; Override Wikimedia image default (nobody:nogroup) to match Apache + file ownership.
; The MediaWiki installer, jobrunner, and Apache all use www-data (UID 33).
; SQLite DB files are mode 600 owned by www-data, so FPM workers must match.
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 12
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 10

; Allow environment variables from the container to reach PHP
clear_env = no

; PHP diagnostics go to the container log, and nowhere else.
;
; This block used to read:
;     php_admin_value[error_log] = /tmp/fpm-php.www.log
;     php_admin_flag[log_errors] = off
; which meant PHP errors were written *nowhere at all*. log_errors=off disables
; the error log outright, so the /tmp path never existed; setup.sh separately
; sets display_errors=0 so nothing reached the response either. Verified on a
; live stack by requesting a page that calls an undefined function: HTTP 500, a
; zero-byte body, and not one line in `docker compose logs`, in Apache's log, or
; in any file in the container. An operator looking at a 500 had no way to learn
; why, and Wave 3's "assert no PHP fatals in the error log" had no log to read.
;
; /proc/self/fd/2 is the FPM worker's stderr; with catch_workers_output=yes below
; FPM forwards it to its own error_log (/dev/stderr in php-fpm.conf), so a fatal
; lands in `docker compose logs mediawiki` as
;     PHP message: PHP Fatal error: Uncaught Error: ...
; display_errors stays 0, so none of this is ever rendered into a page.
;
; Cost measured on the same stack: about six lines per page load, all of them
; the three documented-benign upstream messages (a BlueSpicePrivacy hook
; deprecation, the 'Spezialseiten' alias conflict, and an Undefined array key
; "headelement" warning from QuickTemplate). Worth it to stop losing fatals.
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
catch_workers_output = yes
