[www]
; Override Wikimedia image default (nobody:nogroup) to match Apache + file ownership.
; The MediaWiki installer, jobrunner, and Apache all use www-data (UID 33).
; SQLite DB files are mode 600 owned by www-data, so FPM workers must match.
user = www-data
group = www-data
listen = 9000
listen.owner = www-data
listen.group = www-data

pm = dynamic
pm.max_children = 12
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 10

; Allow environment variables from the container to reach PHP
clear_env = no

php_admin_value[error_log] = /tmp/fpm-php.www.log
php_admin_flag[log_errors] = off
catch_workers_output = yes
