# ============================================================
# VERSIONS.yml — what version is this fork?
#
# One machine-readable answer, checked against the tree by
# `scripts/ci/version-consistency.sh` (T0, ~1s, no containers) on every push.
#
# Before this file existed the repository gave four different answers at once:
# MW_VERSION said 1.43.5, app/composer.lock said 5.1.4 with one package at
# 5.1.5, publiccode.yml said 5.1.3, and the docs said 5.1.3. Nobody could
# answer "are we affected by CVE-X" without reading the lockfile by hand, and
# the openCode catalogue was being told the wrong number.
#
# This file is the declaration. The tree is the fact. When they disagree the
# gate fails and you fix whichever one is wrong — see
# docs/dev/upgrade-runbook.md step 7.
#
# Editing rules
#   * A BlueSpice bump is a two-line edit: `bluespice:` here, and the same
#     value in publiccode.yml. All 58 BlueSpice extensions and all 59
#     bluespice/* composer packages are checked against that one baseline.
#   * Anything that deliberately differs goes under `exceptions:` with a
#     reason. An exception with no reason is a version nobody decided on.
#   * `extensions:` is generated, not hand-written:
#         python3 scripts/lib/versions.py emit-extensions
#   * `frozen:` is Track C of the security process (§10.3). Those two packages
#     are invisible to Renovate, to composer audit and to the release-watch
#     job, so the only signal they will ever have is the `last_reviewed` date
#     below. See SECURITY.md.
# ============================================================

# ─── The two numbers that define the release ────────────────────────
# mw_core must equal MW_VERSION in app/includes/Defines.php.
mw_core: '1.43.9'
# bluespice is the baseline every bluespice/* package and every BlueSpice*
# extension is expected to carry, and what publiccode.yml declares.
bluespice: '5.1.9'

# ─── The runtime, as the compose file and Dockerfiles state it ──────
# php is not a tag of its own anywhere: it is encoded in the wikimedia image
# names (bookworm-php83-fpm, bookworm-php83-jobrunner), and every image that
# states one must agree.
php: '8.3'
mariadb: '10.11'
opensearch: '2.18.0'
haystack: '2.15.0'
python: '3.11'

# ─── Deliberate divergences ─────────────────────────────────────────
# Keyed by composer package name or by extension directory name. Each one is a
# decision somebody made; the reason belongs in the comment.
exceptions:
  # Shipped one patch ahead of the rest of the 5.1.9 set by upstream BlueSpice.
  # It was 5.1.5 against the 5.1.4 baseline; upstream still ships it ahead, so
  # `5.1.*` resolves it to 5.1.10 and it stays an exception rather than a pin.
  bluespice/package-wikifarm: '5.1.10'
  BlueSpiceWikiFarm: '5.1.10'

# ─── Track C — frozen, and permanently unmonitorable ────────────────
# Both point at git@gitlab.hallowelt.com, which this project cannot reach.
# docker/setup.sh strips them from composer.lock and the vendored source under
# app/extensions/ is used instead. No tooling will ever flag a CVE in them.
frozen:
  hallowelt/chatbot:
    vendored_from: 'gitlab.hallowelt.com/GovTech/mediawiki-extensions-chatbot@d6ab09fb511fe8d483dab3fd2eaccd04fe73e5d5'
    version: 'dev-main'
    owner: 'unassigned — see SECURITY.md'
    last_reviewed: '2026-08-03'
    why: >-
      Private GitLab, unreachable from CI. Stripped from composer.lock by
      docker/setup.sh; app/extensions/ChatBot is the vendored copy.
  mediawiki/page-header:
    vendored_from: 'gitlab.hallowelt.com/BlueSpice/mediawiki-extensions-pageheader@505d0aa449e59929744be40feaaa08f5687b9737'
    version: '3.0.5'
    owner: 'unassigned — see SECURITY.md'
    last_reviewed: '2026-08-03'
    why: >-
      Private GitLab, unreachable from CI. Stripped from composer.lock by
      docker/setup.sh; app/extensions/PageHeader is the vendored copy.

# ─── The installed extension inventory ──────────────────────────────
# 184 directories under app/extensions/ carry an extension.json. The 58
# BlueSpice* ones are checked against the `bluespice` baseline above and are
# deliberately not listed here. The rest move on their own schedules, so each
# is declared: a version changing without this file changing is drift, and
# drift is what the four-way skew was made of.
#
# `core` means the extension ships with MediaWiki and carries no version field
# of its own — it is versioned by mw_core.
#
# Regenerate with:  python3 scripts/lib/versions.py emit-extensions
