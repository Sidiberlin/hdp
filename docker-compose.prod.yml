---
# Pull the published images instead of building them.
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Building from source stays the default and must always work — see
# docker-compose.yml and README-DOCKER.md. This file is the other path: it
# swaps the three services this project builds for the images the `release`
# workflow publishes to GHCR, so a first `up` costs a download instead of a
# ~5 minute, ~5 GB build. The other four services (mariadb and the three
# wikimedia php-fpm/apache2/jobrunner images) are already upstream images and
# are untouched here.
#
# ─── Why `!reset` on build, and not just an `image:` ────────────────
#
# docker-compose.yml declares `build:` for these three. A service with both
# `build:` and `image:` is *built*, not pulled, whenever the image is not
# already in the local store — so an override that only sets `image:` gives an
# operator a five-minute build on a fresh host and no error to explain it. The
# `!reset` tag (compose >= 2.24) deletes the inherited key outright, which
# leaves a pull-only service. Check it with:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
#     | grep -A2 -E '^  (haystack|chatbot-proxy|opensearch):'
#
# There must be no `build:` in that output. If your compose is older than 2.24
# it will fail to parse this file rather than silently ignoring the tag; the
# fallback on such a host is an explicit `docker compose ... pull` before `up`.
#
# ─── Pinning ────────────────────────────────────────────────────────
#
# HDP_IMAGE_TAG defaults to the release this file ships alongside, so a clone
# with no extra configuration gets a known-good set rather than whatever
# `latest` happens to point at. Override it in `.env` to move:
#
#   HDP_IMAGE_TAG=v5.1.9
#
# `:latest` deliberately does not follow a pre-release tag (see
# .github/workflows/release.yml), so it is a defensible thing to ask for — but
# a pinned tag is what an operator wants, and it is what the default gives.
#
# ─── Authentication ─────────────────────────────────────────────────
#
# None needed. These packages are public, so `pull` and `up` work without a
# `docker login` and without a token.
services:
  haystack:
    build: !reset null
    image: ghcr.io/sidiberlin/hdp-haystack:${HDP_IMAGE_TAG:-v5.1.9}

  chatbot-proxy:
    build: !reset null
    image: ghcr.io/sidiberlin/hdp-chatbot-proxy:${HDP_IMAGE_TAG:-v5.1.9}

  opensearch:
    build: !reset null
    # Replaces the local `hdp-opensearch:2.18.0` tag docker-compose.yml sets.
    image: ghcr.io/sidiberlin/hdp-opensearch:${HDP_IMAGE_TAG:-v5.1.9}
