# BlueSpice HDP Edition — Docker Compose
# MediaWiki 1.43.5 + BlueSpice Pro + Haystack RAG + OpenSearch + MariaDB
#
# Secrets are loaded from Infisical at container start — no plaintext
# passwords in .env. The .env file contains only the Infisical machine
# identity (non-secret client ID + URL) and non-secret configuration.
#
# Usage:
#   1. cp .env.example .env  (then edit Infisical credentials + non-secret config)
#   2. docker compose up -d
#   3. docker compose exec mediawiki bash /setup.sh
#   4. Open http://localhost:8080/w/

services:
  # ─── MariaDB ──────────────────────────────────────────────────────
  mariadb:
    image: mariadb:10.11
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_MARIADB_MEM_LIMIT:-1g}
    environment:
      # Passwords injected by entrypoint from Infisical
      MARIADB_ROOT_PASSWORD: "${HDP_DB_ROOT_PASSWORD}"
      MARIADB_DATABASE: bluespice
      MARIADB_USER: bluespice
      MARIADB_PASSWORD: "${HDP_DB_PASSWORD}"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized || mysqladmin ping -h localhost -u root -p$$MARIADB_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - hdp

  # ─── MediaWiki / BlueSpice (PHP-FPM) ──────────────────────────────
  mediawiki:
    # Overridable so CI can pull from a mirror. The default is the upstream
    # ref and is what every install uses; only the GitHub workflows set the
    # variable, because docker-registry.wikimedia.org stopped answering
    # anonymous pulls from GitHub runner IPs on 2026-09-23. See
    # scripts/ci/mirror-images.sh.
    image: ${HDP_MEDIAWIKI_IMAGE:-docker-registry.wikimedia.org/dev/bookworm-php83-fpm:1.0.0}
    user: "${MW_DOCKER_UID:-0}:${MW_DOCKER_GID:-0}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_MEDIAWIKI_MEM_LIMIT:-1g}
    volumes:
      - ./app:/var/www/html/w:cached
      - ./docker/wiki/www.conf:/etc/php/8.3/fpm/pool.d/www.conf:ro
      - ./docker/setup.sh:/setup.sh:ro
      - ./docker/mediawiki/hauptseite.wiki:/hauptseite.wiki:ro
      - ./docker/mediawiki/chatbot-faq.wiki:/chatbot-faq.wiki:ro
      - ./docker/mediawiki/site-nutzungsbedingungen.wiki:/site-nutzungsbedingungen.wiki:ro
      - ./docker/mediawiki/site-datenschutz.wiki:/site-datenschutz.wiki:ro
      - ./docker/mediawiki/site-impressum.wiki:/site-impressum.wiki:ro
      - ./docker/mediawiki/site-haftungsausschluss.wiki:/site-haftungsausschluss.wiki:ro
      - ./docker/mediawiki/site-ueber.wiki:/site-ueber.wiki:ro
      # Codewiki-generated Help-namespace pages (see scripts/convert-docs.sh).
      # setup.sh iterates every *.wiki file here and populates the wiki via
      # edit.php on first boot only (guarded by cache/.wiki-docs-populated).
      - ./docker/mediawiki/wiki-docs:/wiki-docs:ro
      - ./docker/infisical-loader.sh:/infisical-loader.sh:ro
      # The manifest-driven patch applier setup.sh calls after composer.
      # Read-only; the container has no repo root, so paths are passed
      # explicitly via HDP_PATCH_MANIFEST_DIR / HDP_APP_DIR / HDP_PATCH_LIB_DIR.
      #
      # Directory mounts, not single-file mounts. A single-file bind mount pins
      # the inode: editing scripts/apply-patches.sh on the host (or checking
      # out a branch) replaces the file and the container silently keeps
      # running the old one. That cost a debugging cycle here.
      - ./scripts:/hdp-scripts:ro
      - ./docker/patches:/hdp-patches:ro
    env_file: .env
    environment:
      COMPOSER_CACHE_DIR: '/var/www/html/w/cache/composer'
      # Honour MW_SERVER from .env — this environment: block overrides env_file,
      # so hardcoding localhost here silently ignored the value .env.example
      # tells people to set (e.g. MW_SERVER=https://wiki.example.com).
      MW_SERVER: '${MW_SERVER:-http://localhost:${MW_DOCKER_PORT:-8080}}'
      MW_DOCKER_PORT: '${MW_DOCKER_PORT:-8080}'
      MW_SCRIPT_PATH: '/w'
      MW_DOCKER_UID: '${MW_DOCKER_UID:-0}'
      MW_DOCKER_GID: '${MW_DOCKER_GID:-0}'
      MW_LANG: '${MW_LANG:-de}'
      MW_SITENAME: '${MW_SITENAME:-BlueSpice HDP}'
      MW_LOG_DIR: /var/www/html/w/cache
      # Infisical machine identity (non-secret — used to fetch real secrets)
      INFISICAL_URL: '${HDP_INFISICAL_URL}'
      INFISICAL_PROJECT_ID: '${HDP_INFISICAL_PROJECT_ID}'
      INFISICAL_CLIENT_ID: '${HDP_INFISICAL_CLIENT_ID}'
      INFISICAL_CLIENT_SECRET: '${HDP_INFISICAL_CLIENT_SECRET}'
      INFISICAL_ENV: '${HDP_INFISICAL_ENV:-prod}'
      # Secrets resolved from Infisical by setup.sh at runtime
      MW_DB_NAME: bluespice
      MW_DB_USER: bluespice
      MW_DB_PASS: '${HDP_DB_PASSWORD}'
      WIKI_ADMIN_PASS: '${HDP_ADMIN_PASSWORD}'
    healthcheck:
      # PHP-FPM has no HTTP endpoint of its own; a TCP connect to the FastCGI
      # port confirms the master process is accepting connections. Full
      # request-level health is covered by mediawiki-web's healthcheck.
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    depends_on:
      mariadb:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    networks:
      - hdp

  # ─── Apache Web Server ────────────────────────────────────────────
  mediawiki-web:
    # Overridable for CI — see the note on the mediawiki service above.
    image: ${HDP_MEDIAWIKI_WEB_IMAGE:-docker-registry.wikimedia.org/dev/bookworm-apache2:1.0.1}
    user: "${MW_DOCKER_UID:-33}:${MW_DOCKER_GID:-33}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_MEDIAWIKI_WEB_MEM_LIMIT:-512m}
    ports:
      - "${MW_DOCKER_PORT:-8080}:8080"
    volumes:
      - ./app:/var/www/html/w:cached
    env_file: .env
    environment:
      MW_LOG_DIR: /var/www/html/w/cache
      MW_DOCKER_PORT: '${MW_DOCKER_PORT:-8080}'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:8080/w/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    depends_on:
      mediawiki:
        condition: service_started
    networks:
      - hdp

  # ─── MediaWiki Job Runner ─────────────────────────────────────────
  mediawiki-jobrunner:
    # Overridable for CI — see the note on the mediawiki service above.
    image: ${HDP_JOBRUNNER_IMAGE:-docker-registry.wikimedia.org/dev/bookworm-php83-jobrunner:1.0.0}
    user: "${MW_DOCKER_UID:-33}:${MW_DOCKER_GID:-33}"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_JOBRUNNER_MEM_LIMIT:-512m}
    volumes:
      - ./app:/var/www/html/w:cached
    env_file: .env
    environment:
      MW_LOG_DIR: /var/www/html/w/cache
      MW_INSTALL_PATH: /var/www/html/w
    healthcheck:
      # No HTTP endpoint — the runner is a bash loop invoking runJobs.php.
      # Confirm the entrypoint's bash process is still alive as PID 1.
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm 2>/dev/null)\" = 'bash' ] || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      mediawiki:
        condition: service_started
    networks:
      - hdp

  # ─── OpenSearch (Search + RAG vector store) ───────────────────────
  opensearch:
    # Built rather than pulled: adds the ingest-attachment plugin that
    # BlueSpiceExtendedSearch's repofile/externalfile sources require.
    # See docker/opensearch/Dockerfile.
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
    image: hdp-opensearch:2.18.0
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Give headroom above the 512m JVM heap (OPENSEARCH_JAVA_OPTS below)
          # for off-heap/native memory — OpenSearch OOMs badly if this is too tight.
          memory: ${HDP_OPENSEARCH_MEM_LIMIT:-1536m}
    environment:
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=${HDP_OPENSEARCH_PASSWORD}"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u admin:${HDP_OPENSEARCH_PASSWORD} https://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - hdp

  # ─── Haystack RAG Pipeline (hayhooks) ─────────────────────────────
  haystack:
    build:
      context: .
      dockerfile: docker/haystack/Dockerfile
      args:
        HAYSTACK_DEVICE: ${HAYSTACK_DEVICE:-cpu}
        # Ignored by the CPU stage, which pins its own CPU-only index URL.
        # Threaded here anyway so `HAYSTACK_DEVICE=gpu` in .env builds the CUDA
        # wheels the host driver can actually run, whether or not the operator
        # remembered to add docker-compose.gpu.yml. See that file's header.
        HAYSTACK_CUDA_VERSION: ${HAYSTACK_CUDA_VERSION:-cu124}
    # Named so the ingest-scheduler service below can build the identical
    # image under a known tag instead of an implicit compose-generated one —
    # see that service's `image:` for why (R4: the second `build:` becomes a
    # cache hit, not a second build).
    image: hdp-haystack:local
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose. Neither port carries any authentication:
      #   :1416 is the hayhooks admin API — /deploy-yaml and /deploy_files load
      #         attacker-supplied pipeline definitions and Python wrapper modules
      #         into this (root) container, i.e. remote code execution.
      #   :1417 is the RAG query API — no auth, so exposing it hands out unmetered
      #         LLM spend and every indexed wiki document, bypassing the wiki login.
      # Nothing in the stack needs these from the host: chatbot-proxy reaches
      # haystack over the compose network. Change the bind address only behind
      # an authenticating reverse proxy.
      # Both sides templated so HAYHOOKS_PORT / HDP_PDF_PORT name one port each,
      # inside the container and out — the values below are threaded into the
      # container environment, the healthcheck, and chatbot-proxy's HAYHOOKS_URL.
      - "${HDP_BIND_ADDR:-127.0.0.1}:${HAYHOOKS_PORT:-1416}:${HAYHOOKS_PORT:-1416}"
      - "${HDP_BIND_ADDR:-127.0.0.1}:${HDP_PDF_PORT:-1417}:${HDP_PDF_PORT:-1417}"
    deploy:
      resources:
        limits:
          memory: ${HDP_HAYSTACK_MEM_LIMIT:-3g}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -o /dev/null http://localhost:${HDP_PDF_PORT:-1417}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      # Generous start_period: cold start downloads/loads embedding + ranker
      # models and deploys the pipeline before either port responds.
      start_period: 90s
    environment:
      # Ports the entrypoint binds inside the container. Without these the
      # entrypoint fell back to its own defaults, so setting HAYHOOKS_PORT in
      # .env only moved the published port and left the service on 1416.
      HAYHOOKS_PORT: "${HAYHOOKS_PORT:-1416}"
      HDP_PDF_PORT: "${HDP_PDF_PORT:-1417}"
      # OpenSearch connection
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_PASSWORD: "${HDP_OPENSEARCH_PASSWORD}"
      # Infisical machine identity (for fetching LLM API key at startup)
      INFISICAL_URL: '${HDP_INFISICAL_URL}'
      INFISICAL_PROJECT_ID: '${HDP_INFISICAL_PROJECT_ID}'
      INFISICAL_CLIENT_ID: '${HDP_INFISICAL_CLIENT_ID}'
      INFISICAL_CLIENT_SECRET: '${HDP_INFISICAL_CLIENT_SECRET}'
      INFISICAL_ENV: '${HDP_INFISICAL_ENV:-prod}'
      # LLM config (non-secret — the key itself comes from Infisical)
      HDP_LLM_BASE_URL: '${HDP_LLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}'
      HDP_LLM_MODEL: '${HDP_LLM_MODEL:-glm-4.7}'
      HAYSTACK_DEVICE: '${HAYSTACK_DEVICE:-cpu}'
      # LLM API key — .env fallback for users without Infisical.
      # If Infisical IS configured, infisical-loader.sh overwrites this at
      # container start with the value fetched from Infisical (source of truth).
      HDP_LLM_API_KEY: '${HDP_LLM_API_KEY:-}'
      # Embedding provider config (non-secret — keys/tokens come from Infisical)
      # See .env.example for the three supported modes: local | remote | hf_space
      HDP_EMBEDDING_PROVIDER: '${HDP_EMBEDDING_PROVIDER:-local}'
      HDP_EMBEDDING_MODEL: '${HDP_EMBEDDING_MODEL:-mixedbread-ai/deepset-mxbai-embed-de-large-v1}'
      HDP_EMBEDDING_DIM: '${HDP_EMBEDDING_DIM:-1024}'
      HDP_EMBEDDING_BASE_URL: '${HDP_EMBEDDING_BASE_URL:-}'
      HDP_EMBEDDING_HF_SPACE_ID: '${HDP_EMBEDDING_HF_SPACE_ID:-}'
      # Embedding secrets — .env fallback for users without Infisical (same
      # override-at-runtime behavior as HDP_LLM_API_KEY above).
      HDP_EMBEDDING_API_KEY: '${HDP_EMBEDDING_API_KEY:-}'
      HDP_EMBEDDING_HF_TOKEN: '${HDP_EMBEDDING_HF_TOKEN:-}'
      # Database access for ingestion script
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: bluespice
      DB_USER: bluespice
      HDP_DB_PASSWORD: "${HDP_DB_PASSWORD}"
      # MediaWiki API access for ingestion
      MW_API_URL: "http://mediawiki-web:8080/w/api.php"
      MW_ADMIN_USER: "Admin"
      HDP_ADMIN_PASSWORD: "${HDP_ADMIN_PASSWORD}"
      # Base URL used to build the ingestion API's page_urls in its response
      # (D12) — the same value MediaWiki itself uses, see .env.example.
      MW_SERVER: '${MW_SERVER:-http://localhost:${MW_DOCKER_PORT:-8080}}'
      # ─── Ingestion API (QoL6, D8/D9/D12) — .env fallback for secrets;
      # Infisical overwrites HDP_-prefixed ones at container start, same
      # pattern as HDP_LLM_API_KEY above. Empty HDP_INGEST_API_KEY means the
      # route answers 503 (fail closed, D8) — nothing below widens exposure
      # on its own.
      HDP_INGEST_API_KEY: '${HDP_INGEST_API_KEY:-}'
      HDP_INGEST_BOT_USER: '${HDP_INGEST_BOT_USER:-HDPIngestBot}'
      HDP_INGEST_BOT_PASSWORD: '${HDP_INGEST_BOT_PASSWORD:-}'
      HDP_INGEST_API_MAX_PAGES: '${HDP_INGEST_API_MAX_PAGES:-50}'
      HDP_INGEST_API_RATE_PER_MIN: '${HDP_INGEST_API_RATE_PER_MIN:-6}'
      HDP_INGEST_ALLOWED_CATEGORIES: '${HDP_INGEST_ALLOWED_CATEGORIES:-}'
    volumes:
      - haystack_models:/root/.cache/huggingface
      # D4's shared lock volume — mounted here and in ingest-scheduler below,
      # both at the same path, so fcntl.flock() in ingest_hdp_wiki.py's
      # acquire_lock() sees one inode regardless of which container an
      # ingestion runs in.
      - haystack_state:/var/lib/hdp-ingest
      # R1 (ratified): bind-mount the ingestion pipeline module and the API
      # router on top of the Dockerfile's COPY, read-only. On the
      # docker-compose.prod*.yml paths the pulled image can be an older
      # release that predates D3/D4/D9 (ingest_hdp_wiki.py) or the ingestion
      # API entirely (ingest_api.py) — the bind mount is what makes the
      # flock/--max-pages behavior work everywhere without a rebuild. The
      # ingestion API route itself still needs hdp_api_server.py to import
      # ingest_api's router (D7), which only a rebuilt/newer image carries —
      # see README-DOCKER.md's Ingestion API section.
      - ./docker/haystack/ingest_hdp_wiki.py:/opt/pipeline/ingest_hdp_wiki.py:ro
      - ./docker/haystack/ingest_api.py:/opt/pipeline/ingest_api.py:ro
      - ./docker/haystack/ingest_validate.py:/opt/pipeline/ingest_validate.py:ro
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - hdp

  # ─── Ingestion Scheduler (periodic --missing-only re-ingest, QoL6) ─
  # Same image as haystack (see haystack's `image:` note above — this is
  # what turns the second `build:` into a cache hit, not a second image), a
  # different entrypoint. D1: a sidecar rather than a second background
  # process inside entrypoint.sh, so this loop has its own logs, its own
  # restart policy, its own memory limit, and can be stopped
  # (HDP_INGEST_INTERVAL_MIN=0, or `docker compose stop ingest-scheduler`)
  # without taking the RAG query API down with it.
  ingest-scheduler:
    build:
      context: .
      dockerfile: docker/haystack/Dockerfile
      args:
        HAYSTACK_DEVICE: ${HAYSTACK_DEVICE:-cpu}
        HAYSTACK_CUDA_VERSION: ${HAYSTACK_CUDA_VERSION:-cu126}
        HAYSTACK_TORCH_VERSION: ${HAYSTACK_TORCH_VERSION:-2.14.0}
    image: hdp-haystack:local
    # F4: entrypoint:, never command: — docker/haystack/Dockerfile has no
    # CMD, so a `command:` override on this image is appended as arguments
    # to entrypoint.sh, which ignores them and boots the whole RAG stack
    # (hayhooks + the query API) a second time instead of this loop.
    entrypoint: ["/opt/pipeline/ingest-scheduler.sh"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_INGEST_SCHEDULER_MEM_LIMIT:-2g}
    environment:
      # ─── The three scheduler knobs (D3/D5/D6) ───────────────────────
      HDP_INGEST_INTERVAL_MIN: '${HDP_INGEST_INTERVAL_MIN:-5}'
      HDP_INGEST_MAX_PAGES: '${HDP_INGEST_MAX_PAGES:-25}'
      HDP_INGEST_BACKOFF_MAX_MIN: '${HDP_INGEST_BACKOFF_MAX_MIN:-60}'
      # ─── Everything ingest_hdp_wiki.py itself needs — haystack's
      # environment: block minus the LLM/hayhooks-only keys. Kept in step by
      # hand; tests/unit/test_compose_ingest_scheduler.py pins the parts that
      # must never drift (entrypoint:, the healthcheck, the shared volume).
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
      OPENSEARCH_PASSWORD: "${HDP_OPENSEARCH_PASSWORD}"
      INFISICAL_URL: '${HDP_INFISICAL_URL}'
      INFISICAL_PROJECT_ID: '${HDP_INFISICAL_PROJECT_ID}'
      INFISICAL_CLIENT_ID: '${HDP_INFISICAL_CLIENT_ID}'
      INFISICAL_CLIENT_SECRET: '${HDP_INFISICAL_CLIENT_SECRET}'
      INFISICAL_ENV: '${HDP_INFISICAL_ENV:-prod}'
      HAYSTACK_DEVICE: '${HAYSTACK_DEVICE:-cpu}'
      HDP_EMBEDDING_PROVIDER: '${HDP_EMBEDDING_PROVIDER:-local}'
      HDP_EMBEDDING_MODEL: '${HDP_EMBEDDING_MODEL:-mixedbread-ai/deepset-mxbai-embed-de-large-v1}'
      HDP_EMBEDDING_DIM: '${HDP_EMBEDDING_DIM:-1024}'
      HDP_EMBEDDING_BASE_URL: '${HDP_EMBEDDING_BASE_URL:-}'
      HDP_EMBEDDING_HF_SPACE_ID: '${HDP_EMBEDDING_HF_SPACE_ID:-}'
      HDP_EMBEDDING_API_KEY: '${HDP_EMBEDDING_API_KEY:-}'
      HDP_EMBEDDING_HF_TOKEN: '${HDP_EMBEDDING_HF_TOKEN:-}'
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_NAME: bluespice
      DB_USER: bluespice
      HDP_DB_PASSWORD: "${HDP_DB_PASSWORD}"
      MW_API_URL: "http://mediawiki-web:8080/w/api.php"
      MW_ADMIN_USER: "Admin"
      HDP_ADMIN_PASSWORD: "${HDP_ADMIN_PASSWORD}"
    volumes:
      - haystack_models:/root/.cache/huggingface
      - haystack_state:/var/lib/hdp-ingest
      # R1 (ratified): bind-mount the scheduler's own entrypoint script plus
      # the pipeline module it runs, read-only, in addition to the
      # Dockerfile's COPY — see the identical note on haystack's volumes
      # above. This is what makes the scheduler work on every install path,
      # published-image ones included, with no image rebuild.
      - ./docker/haystack/ingest-scheduler.sh:/opt/pipeline/ingest-scheduler.sh:ro
      - ./docker/haystack/ingest_hdp_wiki.py:/opt/pipeline/ingest_hdp_wiki.py:ro
    healthcheck:
      # No HTTP endpoint — like mediawiki-jobrunner (F15), this is a bash
      # loop. Confirm the entrypoint's bash process is still alive as PID 1.
      # F14: every service in HDP_T4_SERVICES needs a healthcheck, or T4
      # treats "no healthcheck" as unhealthy and hangs until its budget
      # expires — this service is not in that list (it needs no live wiki
      # traffic to be meaningful), but it gets one anyway on principle.
      test: ["CMD-SHELL", "[ \"$(cat /proc/1/comm 2>/dev/null)\" = 'bash' ] || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - hdp

  # ─── ChatBot Proxy (Deepset → Haystack adapter) ───────────────────
  chatbot-proxy:
    build:
      context: ./docker/chatbot-proxy
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${HDP_CHATBOT_PROXY_MEM_LIMIT:-256m}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    environment:
      HAYHOOKS_URL: "http://haystack:${HDP_PDF_PORT:-1417}"
      PIPELINE_NAME: "hdp_pipeline"
      CHATBOT_PROXY_PORT: "8080"
    depends_on:
      - haystack
    networks:
      - hdp

volumes:
  mariadb_data:
  opensearch_data:
  haystack_models:
  # D4's shared lock volume — mounted at /var/lib/hdp-ingest in haystack and
  # ingest-scheduler, nowhere else. Tiny (one lock file); not worth its own
  # memory/size note.
  haystack_state:

networks:
  hdp:
    driver: bridge
